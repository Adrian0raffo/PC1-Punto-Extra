spring.application.name=week07-lab

# --- Base de datos (contenedor de docker-compose.yml) ---
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/${POSTGRES_DB:flyaway}
spring.datasource.username=${POSTGRES_USER:flyaway}
spring.datasource.password=${POSTGRES_PASSWORD:flyaway}

# Hibernate crea/actualiza las tablas a partir de las entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# --- JWT (mision 3) ---
# El secreto debe tener al menos 32 caracteres (HS256). En produccion, definir JWT_SECRET.
jwt.secret=${JWT_SECRET:fly-away-travel-dev-secret-change-me-please-32+chars}
jwt.expiration=${JWT_EXPIRATION:3600000}

# --- Email de confirmacion (mision 6) ---
# Carpeta donde se guardan los archivos flight_booking_email_${booking_id}.txt
booking.email.dir=${BOOKING_EMAIL_DIR:emails}
