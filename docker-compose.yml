services:
  db:
    image: postgres:17-alpine
    container_name: week07-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flyaway}
      POSTGRES_USER: ${POSTGRES_USER:-flyaway}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flyaway}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - week07-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flyaway} -d ${POSTGRES_DB:-flyaway}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  week07-pgdata:
